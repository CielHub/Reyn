# Masukkan link Private Server Roblox di bawah ini
# Contoh: https://www.roblox.com/games/123456789/Game-Name?privateServerLinkCode=abc123xyz
PRIVATE_SERVER_LINK=""

# Global Map / Place ID (opsional). Contoh: 123456789
# Digunakan jika tidak ada Private Server Link global maupun per-package.
GLOBAL_PLACE_ID=""

# Maksimal waktu tunggu Smart Wait (dalam detik) sebelum fallback ke Dumb Wait
TIMEOUT_SECONDS=45

# Jeda minimum setelah force close sebelum single-package recovery dimulai
# Nilai di bawah 30 detik akan otomatis dinaikkan menjadi 30 detik.
RECOVERY_DELAY_SECONDS=30


# ============================================================
# PHASE D1 - DEVICE REGISTRATION & HEARTBEAT
# ============================================================
# Disabled by default. Enable only after a CARRERA control gateway is ready.
DEVICE_AGENT_ENABLED=0

# Friendly device name shown by the future Discord control panel.
# Example: Device-01
DEVICE_NAME=""

# Base URL of the CARRERA control gateway.
# Example: https://control.example.com
DEVICE_GATEWAY_URL=""

# Shared enrollment token used only to register this device.
DEVICE_ENROLLMENT_TOKEN=""

# Heartbeat interval and HTTP timeout.
DEVICE_HEARTBEAT_INTERVAL=30
DEVICE_GATEWAY_TIMEOUT=8


# ============================================================
# PHASE D2-L - LOCAL CONTROLLER HUB
# ============================================================
# Enable this ONLY on the designated Controller Device.
# The Controller Device still runs the normal CARRERA-HUB engine.
CONTROLLER_ENABLED=0
CONTROLLER_HOST="0.0.0.0"
CONTROLLER_PORT=8765

# Keep these secrets private. Do not commit them to GitHub.
# Enrollment token: workers use this only during registration.
CONTROLLER_ENROLLMENT_TOKEN=""

# Status token: future Discord/controller clients use this for read-only status.
CONTROLLER_STATUS_TOKEN=""

# Worker is considered offline after this many seconds without heartbeat.
CONTROLLER_OFFLINE_AFTER=90


# ============================================================
# PHASE D3R1 - INTEGRATED DISCORD CONTROLLER
# ============================================================
# Discord bot berjalan hanya pada Controller Device.
# D3R1 read-only: command yang tersedia hanya /status.
DISCORD_BOT_ENABLED=0

# Discord Bot Token. Rahasiakan, jangan commit ke GitHub.
DISCORD_BOT_TOKEN=""

# Discord Server/Guild ID untuk sinkronisasi slash command cepat.
DISCORD_GUILD_ID=""

# Controller lokal. Umumnya tidak perlu diubah.
DISCORD_CONTROLLER_URL="http://127.0.0.1:8765"

# Jika kosong, otomatis menggunakan CONTROLLER_STATUS_TOKEN.
DISCORD_CONTROLLER_STATUS_TOKEN=""
DISCORD_STATUS_TIMEOUT=8
