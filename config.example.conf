# Masukkan link Private Server Roblox di bawah ini
# Contoh: https://www.roblox.com/games/123456789/Game-Name?privateServerLinkCode=abc123xyz
PRIVATE_SERVER_LINK=""

# Global Map / Place ID (opsional). Contoh: 123456789
# Digunakan jika tidak ada Private Server Link global maupun per-package.
GLOBAL_PLACE_ID=""

# Maksimal waktu tunggu Smart Wait (dalam detik) sebelum fallback ke Dumb Wait
TIMEOUT_SECONDS=45

# Jeda minimum setelah force close sebelum single-package recovery dimulai
# Nilai di bawah 30 detik akan otomatis dinaikkan menjadi 30 detik.
RECOVERY_DELAY_SECONDS=30


# ============================================================
# PHASE D1 - DEVICE REGISTRATION & HEARTBEAT
# ============================================================
# Disabled by default. Enable only after a CARRERA control gateway is ready.
DEVICE_AGENT_ENABLED=0

# Friendly device name shown by the future Discord control panel.
# Example: Device-01
DEVICE_NAME=""

# Base URL of the CARRERA control gateway.
# Example: https://control.example.com
DEVICE_GATEWAY_URL=""

# Shared enrollment token used only to register this device.
DEVICE_ENROLLMENT_TOKEN=""

# Heartbeat interval and HTTP timeout.
DEVICE_HEARTBEAT_INTERVAL=30
DEVICE_GATEWAY_TIMEOUT=8
