# Masukkan link Private Server Roblox di bawah ini
# Contoh: https://www.roblox.com/games/123456789/Game-Name?privateServerLinkCode=abc123xyz
PRIVATE_SERVER_LINK=""

# Global Map / Place ID (opsional). Contoh: 123456789
# Digunakan jika tidak ada Private Server Link global maupun per-package.
GLOBAL_PLACE_ID=""

# Maksimal waktu tunggu Smart Wait (dalam detik) sebelum fallback ke Dumb Wait
TIMEOUT_SECONDS=45

# Jeda minimum setelah force close sebelum single-package recovery dimulai
# Nilai di bawah 30 detik akan otomatis dinaikkan menjadi 30 detik.
RECOVERY_DELAY_SECONDS=30

# Mode Lobby Only (0=nonaktif, 1=aktif)
# Jika 1, SEMUA package hanya akan login ke Menu/Home Roblox saja dan TIDAK
# akan pernah join Place ID / Private Server manapun, walau field di atas terisi.
# Bisa juga diubah lewat Settings > [3] Mode Lobby Only di dalam aplikasi.
LOBBY_ONLY_MODE=0

# --- PHASE 1: Integrasi Joki Control Bot (opsional) ---
# BOT_WS_URL sudah diisi otomatis (alamat NuraHost, jangan diubah).
# DEVICE_ID dan DEVICE_TOKEN diisi lewat Settings > [12] Device Agent
# di dalam aplikasi (didapat dari /device-register di Discord) --
# kosongkan (biarkan "") kalau device ini belum ikut sistem integrasi.
DEVICE_ID=""
DEVICE_TOKEN=""
BOT_WS_URL="ws://nano-1.nura.host:5067"
